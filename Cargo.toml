[package]
name = "toy-heaan-ckks"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
rustfft = "6"
comfy-table = "7.2.2"
thiserror = "2"
num-complex = "0.4"
# Planned: structured logging in the ckks ops.
tracing = "0.1"
# Planned: the M2.6 reference backend (one big modulus).
crypto-bigint = { version = "0.6", features = ["alloc"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1

[[bench]]
name = "primes"
harness = false

[[example]]
name = "sensor_std_dev"
# Run the example's unit tests (contract, encrypted std-dev) with `cargo test`.
test = true
